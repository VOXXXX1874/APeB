[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apeb-benchmark"
version = "1.0.0"
description = "Camera-ready evaluation code for the Agent Personalization Benchmark"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "aiohttp==3.13.3",
    "arxiv==2.4.1",
    "duckduckgo-search==8.1.1",
    "huggingface_hub==1.31.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "json-repair==0.58.6",
    "langchain-community==0.4.1",
    "langchain-experimental==0.4.1",
    "langchain-openai==1.1.11",
    "langgraph==1.2.11",
    "markdownify==1.2.2",
    "numpy==2.4.3",
    "openai==2.29.0",
    "pydantic==2.12.5",
    "pyyaml==6.0.3",
    "rank-bm25==0.2.2",
    "readabilipy==0.3.0",
    "requests==2.32.5",
]

[project.scripts]
apeb = "src.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8.2,<10",
    "pytest-asyncio>=1.0,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]
